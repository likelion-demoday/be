spring:
  application:
    name: resay
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # 최대 30분 음성 파일 업로드를 전제로 한 값
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# JWT
# 서명 키는 HS256 기준 32바이트 이상이어야 한다. 실제 값은 환경변수 JWT_SECRET으로만 주입한다.
jwt:
  secret: ${JWT_SECRET:}
  issuer: resay
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}

# 외부 연동 설정
# 실제 값은 저장소에 두지 않고 환경변수로 주입한다. 담당자별로 본인 값만 채우면 된다.
clova:
  speech:
    invoke-url: ${CLOVA_SPEECH_INVOKE_URL:}
    secret-key: ${CLOVA_SPEECH_SECRET_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}

storage:
  local:
    base-path: ${STORAGE_BASE_PATH:./storage/recordings}
