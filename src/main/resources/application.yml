spring:
  application:
    name: resay
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # 최대 30분 음성 파일 업로드를 전제로 한 값
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# 헬스체크
# - /actuator/health/liveness : 앱이 살아있는지만 본다 (컨테이너 재시작 판단용)
# - /actuator/health          : DB 연결·디스크 여유까지 본다 (모니터링용). 상세 내용은 외부에 노출하지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    diskspace:
      # 음성 파일이 쌓이는 서비스라 여유 공간이 이보다 적으면 DOWN으로 본다 (60GB 디스크의 약 10%)
      threshold: 6GB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# JWT
# 서명 키는 HS256 기준 32바이트 이상이어야 한다. 실제 값은 환경변수 JWT_SECRET으로만 주입한다.
jwt:
  secret: ${JWT_SECRET:}
  issuer: resay
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

# CORS 허용 도메인 (쉼표로 구분). 로컬 기본값은 프론트 개발 서버 포트
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 로그인 · 가입 시도 횟수 제한
# 기록은 서버 메모리에 둔다 (서버 1대 기준. 재시작하면 초기화된다)
rate-limit:
  # 정상 사용자가 막히는 문제가 생겼을 때 급히 끄기 위한 스위치
  enabled: ${RATE_LIMIT_ENABLED:true}
  login:
    # "실패"한 로그인만 센다. 한도를 넘으면 window가 지날 때까지 맞는 비밀번호도 429로 거부한다
    # IP 한도가 더 큰 이유: 학교 · 회사 · 통신사망은 여러 사람이 IP 하나를 같이 쓴다
    max-failures-per-ip: 20
    max-failures-per-email: 5
    window: 10m
  signup:
    # 성공 여부와 관계없이 가입 시도를 센다
    max-attempts-per-ip: 30
    window: 1h

# 크레딧 가격 (1원 = 1크레딧)
# 분석은 일상 중심인지 갈등 중심인지에 따라 다르고, 캐릭터 생성은 계정당 첫 1회가 무료다
credit:
  price:
    analysis-daily: 1500
    analysis-conflict: 2000
    character: 500

# 소셜 로그인
# 키가 없어도 서버는 뜬다. 해당 소셜 로그인 API를 호출할 때만 설정을 확인한다.
oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 프론트가 Kakao.Auth.authorize에 사용한 값과 정확히 같아야 한다
    allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:5173/oauth/kakao/callback}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    # 프론트가 Google Identity Services에 사용하는 Client ID. ID 토큰의 aud와 같아야 한다
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

# 외부 연동 설정
# 실제 값은 저장소에 두지 않고 환경변수로 주입한다. 담당자별로 본인 값만 채우면 된다.
clova:
  speech:
    invoke-url: ${CLOVA_SPEECH_INVOKE_URL:}
    secret-key: ${CLOVA_SPEECH_SECRET_KEY:}
    # 비동기 전사가 끝나면 CLOVA가 전사 결과를 보내는 주소 (비동기 요청 필수값)
    # 요청마다 뒤에 추측할 수 없는 비밀값을 붙여 보낸다
    callback-base-url: ${CLOVA_SPEECH_CALLBACK_BASE_URL:}

liner:
  api-key: ${LINER_API_KEY:}
  base-url: ${LINER_BASE_URL:https://platform.liner.com}
  model: ${LINER_MODEL:liner-mark-1.1}
  connect-timeout: ${LINER_CONNECT_TIMEOUT:3s}
  read-timeout: ${LINER_READ_TIMEOUT:300s}

openai:
  image:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-2.5-flare}
    size: ${OPENAI_IMAGE_SIZE:1024x1024}
    quality: ${OPENAI_IMAGE_QUALITY:medium}
    output-format: ${OPENAI_IMAGE_OUTPUT_FORMAT:png}
    background: ${OPENAI_IMAGE_BACKGROUND:transparent}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_IMAGE_READ_TIMEOUT:180s}

character:
  image:
    generation-enabled: ${CHARACTER_IMAGE_GENERATION_ENABLED:true}

analysis:
  readiness:
    minimum-total-speaking-duration: ${ANALYSIS_MIN_TOTAL_SPEAKING_DURATION:60s}
    minimum-speaker-speaking-duration: ${ANALYSIS_MIN_SPEAKER_SPEAKING_DURATION:15s}
    minimum-speaker-character-count: ${ANALYSIS_MIN_SPEAKER_CHARACTER_COUNT:30}
    minimum-speaker-ratio-percent: ${ANALYSIS_MIN_SPEAKER_RATIO_PERCENT:5}

storage:
  local:
    base-path: ${STORAGE_BASE_PATH:./storage/recordings}
  character:
    base-path: ${CHARACTER_IMAGE_STORAGE_BASE_PATH:./storage/characters}
