# 운영 설정
# 실제 값은 이 파일에 적지 않는다. 배포 환경의 환경변수로만 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않는다
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: info
    com.example.resay: info

# 운영에서는 localhost 기본값을 쓰지 않도록 반드시 환경변수로 지정한다
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Swagger는 운영에서 기본적으로 끈다. 런칭 전 테스트 서버에서만 SWAGGER_ENABLED=true로 켠다
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
