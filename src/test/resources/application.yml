# 테스트 전용 설정
# 테스트는 로컬 MySQL에 의존하지 않고 H2 인메모리 DB만 사용한다.
# (테스트 클래스패스의 application.yml 이 main 쪽 설정을 대체하므로 필요한 값을 여기에 모두 둔다)
spring:
  application:
    name: resay
  profiles:
    default: test
  datasource:
    url: jdbc:h2:mem:resay;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
