# 운영 서버용 구성: 앱 + MySQL + Caddy(HTTPS 리버스 프록시)
#
# 배포: 로컬에서 ./deploy/push.sh (JAR을 올린 뒤 서버의 ./deploy/deploy.sh 를 실행한다)
#   (서버에서 직접 실행 시) docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build
#
# 메모리 배분 (Lightsail 2GB + 스왑 2GB 기준)
#   app   : JVM 힙 512MB + 메타스페이스 등 → 약 800MB
#   mysql : 버퍼 풀 256MB → 약 450MB
#   caddy : 약 30MB

# 프로젝트 이름을 고정한다. 폴더 이름에서 따오게 두면 폴더가 바뀔 때 볼륨(DB, 음성 파일)을 새로 만들어 버린다
name: resay

services:
  app:
    build:
      context: .
      # 빌드 기록(provenance)을 붙이면 JAR이 같아도 빌드할 때마다 이미지 ID가 바뀐다.
      # 끄면 내용이 같을 때 ID가 그대로라, 코드가 바뀐 배포에서만 컨테이너가 교체된다
      provenance: false
    image: resay-app:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/resay?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      STORAGE_BASE_PATH: /app/storage
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
      # 아래는 값을 적지 않으면 deploy/.env.prod 에 있는 같은 이름의 값이 전달된다.
      # .env.prod 를 통째로 넘기지 않고 앱에 필요한 것만 적는다. (DB root 비밀번호 같은 값이 앱 컨테이너에 들어가지 않게)
      # 앱에 새 환경변수가 필요해지면 여기와 deploy/.env.prod.example 에 같이 추가한다.
      DB_USERNAME:
      DB_PASSWORD:
      DB_POOL_SIZE:
      JWT_SECRET:
      JWT_ACCESS_TOKEN_EXPIRATION:
      JWT_REFRESH_TOKEN_EXPIRATION:
      CORS_ALLOWED_ORIGINS:
      KAKAO_REST_API_KEY:
      KAKAO_CLIENT_SECRET:
      KAKAO_ALLOWED_REDIRECT_URIS:
      GOOGLE_CLIENT_ID:
      CLOVA_SPEECH_INVOKE_URL:
      CLOVA_SPEECH_SECRET_KEY:
      LINER_API_KEY:
      OPENAI_API_KEY:
      SPRING_JPA_HIBERNATE_DDL_AUTO:
      SWAGGER_ENABLED:
    # 사용자가 올린 파일을 다루는 컨테이너라 권한을 최소로 둔다.
    # 이미 root가 아닌 사용자로 실행되고(Dockerfile), 리눅스 권한(capability)을 모두 떼고 권한 상승도 막는다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # 음성 파일은 컨테이너를 다시 만들어도 남아 있어야 한다
      - resay-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resay
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - resay-mysql:/var/lib/mysql
    # 외부로 포트를 열지 않는다 (앱 컨테이너에서만 접근)
    healthcheck:
      # 처음 기동할 때 뜨는 초기화용 임시 서버는 TCP를 받지 않는다. TCP로 확인해야 실제 접속 가능한 시점에 healthy가 된다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      # 파일 하나가 아니라 폴더를 연결한다. 파일만 연결하면 배포로 파일이 교체돼도 컨테이너는 옛 내용을 계속 본다
      - ./deploy/caddy:/etc/caddy:ro
      # 발급받은 인증서가 여기 저장된다. 지우면 재발급되고, 너무 자주 재발급하면 Let's Encrypt 발급 제한에 걸린다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  resay-storage:
  resay-mysql:
  caddy-data:
  caddy-config:
